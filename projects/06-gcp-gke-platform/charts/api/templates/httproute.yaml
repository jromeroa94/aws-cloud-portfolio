{{- if .Values.gateway.enabled }}
# Enrutado del Gateway al Service. Con TLS la ruta de la aplicación cuelga del listener HTTPS y
# una segunda HTTPRoute en el listener HTTP responde 301 hacia https.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "platform-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "platform-api.fullname" . }}
      {{- if .Values.gateway.tls.certmap }}
      sectionName: https
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "platform-api.fullname" . }}
          port: {{ .Values.service.port }}
{{- if .Values.gateway.tls.certmap }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "platform-api.fullname" . }}-redirect-https
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "platform-api.fullname" . }}
      sectionName: http
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
