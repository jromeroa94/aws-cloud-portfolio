# KSA de la aplicación. La anotación iam.gke.io/gcp-service-account la vincula por Workload
# Identity a la GSA creada por Terraform; el binding roles/iam.workloadIdentityUser del lado de
# IAM apunta a PROJECT_ID.svc.id.goog[platform/platform-api], por eso el nombre es fijo.
# El token de Kubernetes NO se monta en el Pod (automountServiceAccountToken en el Deployment):
# la app no habla con la API de Kubernetes, solo con APIs de Google vía el metadata server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
  {{- if or .Values.gcpServiceAccount .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
