# Service interno. El Gateway de GKE lo referencia desde la HTTPRoute y crea automáticamente
# los NEG (balanceo nativo de contenedores: el balanceador habla con los pods, no con los nodos).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "platform-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: HTTP
